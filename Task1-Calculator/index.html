<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha - Professional Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --calc-bg: rgba(30, 41, 59, 0.7);
            --calc-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --op-color: #38bdf8;
            --op-bg: rgba(56, 189, 248, 0.1);
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.15);
            --btn-active: rgba(255, 255, 255, 0.25);
            --clear-color: #f43f5e;
            --clear-bg: rgba(244, 63, 94, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            padding: 20px;
            color: var(--text-primary);
        }

        .calculator-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            background: var(--calc-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--calc-border);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(99, 102, 241, 0.1);
            overflow: hidden;
        }

        .calc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand-title {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .history-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            padding: 4px;
        }

        .history-toggle:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }

        .display-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            text-align: right;
            margin-bottom: 24px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            word-break: break-all;
            word-wrap: break-word;
        }

        .previous-operand {
            font-size: 0.95rem;
            color: var(--text-secondary);
            min-height: 24px;
            margin-bottom: 6px;
            transition: all 0.2s;
        }

        .current-operand {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            transition: all 0.2s;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button.btn {
            border: none;
            outline: none;
            background: var(--btn-bg);
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 600;
            height: 64px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button.btn:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
        }

        button.btn:active {
            transform: translateY(0) scale(0.96);
            background: var(--btn-active);
        }

        button.btn-op {
            color: var(--op-color);
            background: var(--op-bg);
        }

        button.btn-op:hover {
            background: rgba(56, 189, 248, 0.25);
        }

        button.btn-action {
            color: var(--clear-color);
            background: var(--clear-bg);
        }

        button.btn-action:hover {
            background: rgba(244, 63, 94, 0.25);
        }

        button.btn-equals {
            background: var(--accent-color);
            color: #ffffff;
            grid-column: span 2;
        }

        button.btn-equals:hover {
            background: var(--accent-hover);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .history-panel {
            position: absolute;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(25px);
            z-index: 10;
            padding: 24px;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .history-panel.active {
            right: 0;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 3px solid var(--accent-color);
            text-align: right;
            cursor: pointer;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .history-expr {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .history-res {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .clear-history-btn {
            margin-top: 16px;
            background: var(--clear-bg);
            color: var(--clear-color);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-history-btn:hover {
            background: rgba(244, 63, 94, 0.3);
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <div class="calc-header">
            <span class="brand-title">CodeAlpha Calc</span>
            <button class="history-toggle" id="historyToggleBtn" title="History">
                <i class="fa-solid fa-history"></i>
            </button>
        </div>

        <div class="display-panel">
            <div class="previous-operand" id="previousOperand"></div>
            <div class="current-operand" id="currentOperand">0</div>
        </div>

        <div class="keypad">
            <button class="btn btn-action" data-action="clear">AC</button>
            <button class="btn btn-action" data-action="delete"><i class="fa-solid fa-backspace"></i></button>
            <button class="btn btn-op" data-action="percent">%</button>
            <button class="btn btn-op" data-operation="÷">÷</button>

            <button class="btn" data-number="7">7</button>
            <button class="btn" data-number="8">8</button>
            <button class="btn" data-number="9">9</button>
            <button class="btn btn-op" data-operation="×">×</button>

            <button class="btn" data-number="4">4</button>
            <button class="btn" data-number="5">5</button>
            <button class="btn" data-number="6">6</button>
            <button class="btn btn-op" data-operation="-">-</button>

            <button class="btn" data-number="1">1</button>
            <button class="btn" data-number="2">2</button>
            <button class="btn" data-number="3">3</button>
            <button class="btn btn-op" data-operation="+">+</button>

            <button class="btn" data-number="0">0</button>
            <button class="btn" data-number=".">.</button>
            <button class="btn btn-equals" data-action="calculate">=</button>
        </div>

        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <h3>Calculation History</h3>
                <button class="history-toggle" id="closeHistoryBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="history-list" id="historyList">
                <div style="text-align: center; color: var(--text-secondary); margin-top: 40px;">There is no history yet.</div>
            </div>
            <button class="clear-history-btn" id="clearHistoryBtn">Clear History</button>
        </div>
    </div>

    <script>
        class Calculator {
            constructor(previousOperandElement, currentOperandElement) {
                this.previousOperandElement = previousOperandElement;
                this.currentOperandElement = currentOperandElement;
                this.history = [];
                this.clear();
            }

            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.shouldResetScreen = false;
            }

            delete() {
                if (this.shouldResetScreen) return;
                if (this.currentOperand === '0') return;
                if (this.currentOperand.length === 1) {
                    this.currentOperand = '0';
                } else {
                    this.currentOperand = this.currentOperand.toString().slice(0, -1);
                }
            }

            appendNumber(number) {
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                } else if (number === '.' && this.currentOperand.includes('.')) {
                    return;
                } else if (this.shouldResetScreen) {
                    this.currentOperand = number.toString();
                    this.shouldResetScreen = false;
                } else {
                    this.currentOperand += number.toString();
                }
            }

            chooseOperation(operation) {
                if (this.currentOperand === '') return;
                if (this.previousOperand !== '') {
                    this.compute();
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '';
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);

                if (isNaN(prev) || isNaN(current)) return;

                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '×':
                        computation = prev * current;
                        break;
                    case '÷':
                        if (current === 0) {
                            alert("Cannot divide by zero!");
                            this.clear();
                            return;
                        }
                        computation = prev / current;
                        break;
                    default:
                        return;
                }

                const expression = `${this.previousOperand} ${this.operation} ${this.currentOperand}`;
                this.addHistory(expression, computation);

                this.currentOperand = computation.toString();
                this.operation = undefined;
                this.previousOperand = '';
                this.shouldResetScreen = true;
            }

            percentage() {
                const current = parseFloat(this.currentOperand);
                if (isNaN(current)) return;
                this.currentOperand = (current / 100).toString();
            }

            addHistory(expression, result) {
                this.history.unshift({ expression, result });
                this.renderHistory();
            }

            renderHistory() {
                const historyList = document.getElementById('historyList');
                if (this.history.length === 0) {
                    historyList.innerHTML = `<div style="text-align: center; color: var(--text-secondary); margin-top: 40px;">There is no history yet.</div>`;
                    return;
                }

                historyList.innerHTML = this.history.map(item => `
                    <div class="history-item" onclick="calc.useHistoryResult('${item.result}')">
                        <div class="history-expr">${item.expression} =</div>
                        <div class="history-res">${item.result}</div>
                    </div>
                `).join('');
            }

            useHistoryResult(val) {
                this.currentOperand = val.toString();
                this.shouldResetScreen = true;
                this.updateDisplay();
                document.getElementById('historyPanel').classList.remove('active');
            }

            clearHistory() {
                this.history = [];
                this.renderHistory();
            }

            updateDisplay() {
                this.currentOperandElement.innerText = this.currentOperand;
                if (this.operation != null) {
                    this.previousOperandElement.innerText = `${this.previousOperand} ${this.operation}`;
                } else {
                    this.previousOperandElement.innerText = '';
                }
            }
        }

        const previousOperandElement = document.getElementById('previousOperand');
        const currentOperandElement = document.getElementById('currentOperand');
        const calc = new Calculator(previousOperandElement, currentOperandElement);

        document.querySelectorAll('[data-number]').forEach(button => {
            button.addEventListener('click', () => {
                calc.appendNumber(button.dataset.number);
                calc.updateDisplay();
            });
        });

        document.querySelectorAll('[data-operation]').forEach(button => {
            button.addEventListener('click', () => {
                calc.chooseOperation(button.dataset.operation);
                calc.updateDisplay();
            });
        });

        document.querySelectorAll('[data-action]').forEach(button => {
            button.addEventListener('click', () => {
                const action = button.dataset.action;
                if (action === 'clear') calc.clear();
                if (action === 'delete') calc.delete();
                if (action === 'calculate') calc.compute();
                if (action === 'percent') calc.percentage();
                calc.updateDisplay();
            });
        });

        window.addEventListener('keydown', e => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                calc.appendNumber(e.key);
            }
            if (e.key === '+') calc.chooseOperation('+');
            if (e.key === '-') calc.chooseOperation('-');
            if (e.key === '*') calc.chooseOperation('×');
            if (e.key === '/') {
                e.preventDefault();
                calc.chooseOperation('÷');
            }
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calc.compute();
            }
            if (e.key === 'Backspace') calc.delete();
            if (e.key === 'Escape') calc.clear();
            if (e.key === '%') calc.percentage();
            calc.updateDisplay();
        });

        const historyPanel = document.getElementById('historyPanel');
        document.getElementById('historyToggleBtn').addEventListener('click', () => historyPanel.classList.add('active'));
        document.getElementById('closeHistoryBtn').addEventListener('click', () => historyPanel.classList.remove('active'));
        document.getElementById('clearHistoryBtn').addEventListener('click', () => calc.clearHistory());
    </script>
</body>
</html>
