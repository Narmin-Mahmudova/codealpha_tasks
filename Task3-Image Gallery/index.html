<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha - Interactive Image Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-primary);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }

        .effects-toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            margin: 0 auto 35px auto;
            max-width: fit-content;
            flex-wrap: wrap;
        }

        .effects-toolbar label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .effects-toolbar select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .gallery-item {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            height: 270px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .item-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.9) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .item-overlay {
            opacity: 1;
        }

        .item-overlay h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            transform: translateY(10px);
            transition: transform 0.3s ease;
        }

        .item-overlay span {
            font-size: 0.8rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            transform: translateY(10px);
            transition: transform 0.3s ease 0.05s;
        }

        .gallery-item:hover .item-overlay h3,
        .gallery-item:hover .item-overlay span {
            transform: translateY(0);
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 16px;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: filter 0.3s ease, opacity 0.2s ease;
        }

        .lightbox-caption {
            margin-top: 15px;
            text-align: center;
        }

        .lightbox-caption h3 {
            font-size: 1.25rem;
            color: var(--text-primary);
        }

        .lightbox-caption p {
            font-size: 0.85rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .lightbox-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .lightbox-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }

        .lightbox-btn.prev { left: -70px; }
        .lightbox-btn.next { right: -70px; }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 35px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #f43f5e;
        }

        .filter-grayscale { filter: grayscale(100%); }
        .filter-sepia { filter: sepia(90%); }
        .filter-contrast { filter: contrast(150%); }
        .filter-blur { filter: blur(3px); }

        @media (max-width: 768px) {
            .lightbox-btn.prev { left: 10px; }
            .lightbox-btn.next { right: 10px; }
            .lightbox-btn {
                background: rgba(15, 23, 42, 0.8);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Interactive Image Gallery</h1>
        </header>

        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">All Photos</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="city">City Life</button>
            <button class="filter-btn" data-filter="architecture">Architecture</button>
        </div>

        <div class="effects-toolbar">
            <label for="filterSelect"><i class="fa-solid fa-wand-magic-sparkles"></i> Image FX Filter:</label>
            <select id="filterSelect">
                <option value="none">Normal (Default)</option>
                <option value="filter-grayscale">Grayscale</option>
                <option value="filter-sepia">Vintage Sepia</option>
                <option value="filter-contrast">High Contrast</option>
                <option value="filter-blur">Soft Blur</option>
            </select>
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn" title="Close"><i class="fa-solid fa-xmark"></i></button>
        <button class="lightbox-btn prev" id="prevBtn" title="Previous"><i class="fa-solid fa-chevron-left"></i></button>
        
        <div class="lightbox-content">
            <img src="" alt="" class="lightbox-img" id="lightboxImg">
            <div class="lightbox-caption">
                <h3 id="lightboxTitle"></h3>
                <p id="lightboxCategory"></p>
            </div>
        </div>

        <button class="lightbox-btn next" id="nextBtn" title="Next"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <script>
        const galleryData = [
            {
                title: "Alpine Mountain Range",
                category: "nature",
                categoryName: "Nature",
                img: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&auto=format&fit=crop&q=80"
            },
            {
                title: "Metropolis Night Lights",
                category: "city",
                categoryName: "City Life",
                img: "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=800&auto=format&fit=crop&q=80"
            },
            {
                title: "Futuristic Glass Tower",
                category: "architecture",
                categoryName: "Architecture",
                img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800&auto=format&fit=crop&q=80"
            },
            {
                title: "Misty Pine Forest",
                category: "nature",
                categoryName: "Nature",
                img: "https://images.unsplash.com/photo-1448375240586-882707db888b?w=800&auto=format&fit=crop&q=80"
            },
            {
                title: "Golden Gate Bridge",
                category: "city",
                categoryName: "City Life",
                img: "https://images.unsplash.com/photo-1506146332389-18140dc7b2fb?w=800&auto=format&fit=crop&q=80"
            },
            {
                title: "Modern Villa Design",
                category: "architecture",
                categoryName: "Architecture",
                img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&auto=format&fit=crop&q=80"
            }
        ];

        let filteredItems = [...galleryData];
        let currentIndex = 0;

        const galleryGrid = document.getElementById('galleryGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxCategory = document.getElementById('lightboxCategory');
        const closeBtn = document.getElementById('closeBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const filterSelect = document.getElementById('filterSelect');

        function renderGallery(items) {
            galleryGrid.innerHTML = items.map((item, index) => `
                <div class="gallery-item" onclick="openLightbox(${index})">
                    <img src="${item.img}" alt="${item.title}" class="${filterSelect.value !== 'none' ? filterSelect.value : ''}">
                    <div class="item-overlay">
                        <span>${item.categoryName}</span>
                        <h3>${item.title}</h3>
                    </div>
                </div>
            `).join('');
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filter = btn.dataset.filter;
                if (filter === 'all') {
                    filteredItems = [...galleryData];
                } else {
                    filteredItems = galleryData.filter(item => item.category === filter);
                }
                renderGallery(filteredItems);
            });
        });

        filterSelect.addEventListener('change', (e) => {
            const selectedClass = e.target.value;
            const images = document.querySelectorAll('.gallery-item img');
            
            images.forEach(img => {
                img.className = selectedClass !== 'none' ? selectedClass : '';
            });

            lightboxImg.className = `lightbox-img ${selectedClass !== 'none' ? selectedClass : ''}`;
        });

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function updateLightbox() {
            lightboxImg.style.opacity = '0.3';
            const item = filteredItems[currentIndex];
            
            setTimeout(() => {
                lightboxImg.src = item.img;
                lightboxTitle.innerText = item.title;
                lightboxCategory.innerText = item.categoryName;
                lightboxImg.style.opacity = '1';
            }, 150);
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % filteredItems.length;
            updateLightbox();
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + filteredItems.length) % filteredItems.length;
            updateLightbox();
        }

        closeBtn.addEventListener('click', closeLightbox);
        nextBtn.addEventListener('click', showNext);
        prevBtn.addEventListener('click', showPrev);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        window.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') showNext();
            if (e.key === 'ArrowLeft') showPrev();
        });

        renderGallery(galleryData);
    </script>
</body>
</html>
